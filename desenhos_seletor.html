<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint para o nível-01</title>
    
    <style>
        :root { --primary: #4a90e2; --bg: #e6e6fa; }
        
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            background: var(--bg); 
            display: flex; flex-direction: column; align-items: center; padding: 20px; 
        }

        .controls { 
            background: white; padding: 20px; border-radius: 20px; 
            display: flex; flex-direction: column; gap: 15px; align-items: center;
            margin-bottom: 20px; border: 2px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 800px;
        }

        .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }

        .gallery {
            display: flex; gap: 15px; margin-bottom: 10px; padding: 10px;
            background: #f0f0ff; border-radius: 15px; border: 1px dashed var(--primary);
            justify-content: center; width: 100%;
        }
        .thumb {
            width: 80px; height: 80px; border-radius: 10px; cursor: pointer;
            border: 3px solid white; transition: 0.3s; object-fit: cover; background: white;
        }
        .thumb:hover { transform: translateY(-5px); border-color: var(--primary); }

        .palette { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .swatch { 
            width: 35px; height: 35px; border-radius: 50%; 
            cursor: pointer; border: 2px solid #ddd; transition: 0.2s; 
        }
        .swatch:hover { transform: scale(1.2); }
        .swatch.selected { border-color: #333; transform: scale(1.1); box-shadow: 0 0 5px rgba(0,0,0,0.3); }

        canvas { 
            border: 5px solid var(--primary); background: #fff; 
            cursor: crosshair; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 95vw;
        }

        button, label { 
            padding: 10px 18px; cursor: pointer; border-radius: 50px; 
            border: none; background: var(--primary); color: white; 
            font-weight: bold; transition: 0.2s; font-size: 14px; 
        }
        button:hover { filter: brightness(1.1); }
        .active { background: #333 !important; }
        #fileInput { display: none; }

        /* botão voltar */
        .btn-voltar {
            background: #e05c5c !important;
            box-shadow: 0 4px 0 #b84444;
            transition: all 0.2s;
        }
        .btn-voltar:hover {
            background: #c94f4f !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b84444;
        }
        .btn-voltar:active {
            transform: translateY(3px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <h1 style="color: #5d5dbb;">🎨 Colorir com Balde</h1>

    <div class="controls">
        <h2>Escolha um desenho para colorir:</h2>
        
        <div class="gallery">
            <img src="desenhos/dino.jpeg" class="thumb" onclick="loadPresetImage('desenhos/dino.jpeg')" title="Desenho 1">
            <img src="desenhos/trem.jpeg" class="thumb" onclick="loadPresetImage('desenhos/trem.jpeg')" title="Desenho 2">
            <img src="desenhos/raposa.jpeg" class="thumb" onclick="loadPresetImage('desenhos/raposa.jpeg')" title="Desenho 3">
        </div>

        <div class="row">
            <button id="btnPincel">🖌️ Pincel</button>
            <button id="btnBalde" class="active">🪣 Balde</button>
            <button id="btnUndo" style="background: #6c757d;">↩ Desfazer</button>
            <label for="fileInput">🖼️ Abrir do PC</label>
            <input type="file" id="fileInput" accept="image/*">
            <button id="btnClear" style="background: #ff4d4d;">🧹 Limpar</button>
            <a href="tela de apresentação.html">
                <button class="btn-voltar">🏠 Voltar ao Início</button>
            </a>
        </div>

        <div class="palette" id="palette"></div>
        
        <div class="row">
            <span style="font-size: 12px; color: #666;">Cor personalizada:</span>
            <input type="color" id="colorPicker" value="#4a90e2">
        </div>
    </div>

    <canvas id="tela" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('tela');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let painting = false;

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        clearCanvas();

        const paletteContainer = document.getElementById('palette');
        const colorPicker = document.getElementById('colorPicker');
        
        const cores = [
            '#000000', '#FFFFFF', '#4A90E2', '#50E3C2', '#B8E986', 
            '#F8E71C', '#F5A623', '#D0021B', '#BD10E0', '#9013FE'
        ];

        let selectedColor = cores[2]; 
        let tool = 'balde';
        let historyStack = [];

        cores.forEach(cor => {
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.backgroundColor = cor;
            if (cor === selectedColor) swatch.classList.add('selected');
            
            swatch.onclick = () => {
                selectedColor = cor;
                colorPicker.value = cor;
                document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
            };
            paletteContainer.appendChild(swatch);
        });

        colorPicker.oninput = (e) => {
            selectedColor = e.target.value;
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        };

        function saveState() {
            if (historyStack.length >= 20) historyStack.shift();
            historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        document.getElementById('btnUndo').onclick = () => {
            if (historyStack.length > 0) ctx.putImageData(historyStack.pop(), 0, 0);
        };

        function drawImageOnCanvas(img) {
            saveState();
            clearCanvas();
            const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
            const nw = img.width * ratio;
            const nh = img.height * ratio;
            const posX = (canvas.width - nw) / 2;
            const posY = (canvas.height - nh) / 2;
            ctx.drawImage(img, posX, posY, nw, nh);
        }

        function loadPresetImage(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                drawImageOnCanvas(img);
                console.log("Imagem carregada: " + url);
            };
            img.onerror = () => {
                alert("Erro ao carregar imagem em: " + url + "\nVerifique se a pasta 'desenhos' existe e contém os arquivos img1.png, etc.");
            };
            img.src = url;
        }

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => drawImageOnCanvas(img);
                    img.onerror = () => alert("Erro ao carregar a imagem do seu computador.");
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('btnPincel').onclick = () => { tool = 'pincel'; updateUI('btnPincel'); };
        document.getElementById('btnBalde').onclick = () => { tool = 'balde'; updateUI('btnBalde'); };
        document.getElementById('btnClear').onclick = () => { saveState(); clearCanvas(); };

        function updateUI(id) {
            document.getElementById('btnPincel').classList.remove('active');
            document.getElementById('btnBalde').classList.remove('active');
            document.getElementById(id).classList.add('active');
        }

        canvas.onmousedown = (e) => {
            const { x, y } = getMousePos(e);
            saveState();
            if (tool === 'pincel') {
                painting = true;
                ctx.strokeStyle = selectedColor;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else {
                floodFill(x, y, hexToRgb(selectedColor));
            }
        };

        canvas.onmousemove = (e) => {
            if (!painting || tool !== 'pincel') return;
            const { x, y } = getMousePos(e);
            ctx.lineTo(x, y);
            ctx.stroke();
        };

        canvas.onmouseup = () => painting = false;
        canvas.onmouseleave = () => painting = false;

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.floor((e.clientY - rect.top) * (canvas.height / rect.height))
            };
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function floodFill(startX, startY, fillRGB) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const width = canvas.width;
            const startPos = (startY * width + startX) * 4;
            
            const sR = pixels[startPos], sG = pixels[startPos+1], sB = pixels[startPos+2], sA = pixels[startPos+3];

            if (sR === fillRGB.r && sG === fillRGB.g && sB === fillRGB.b) return;
            if (sR < 100 && sG < 100 && sB < 100 && sA > 150) return;

            const stack = [[startX, startY]];
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const pos = (y * width + x) * 4;
                if (x < 0 || x >= width || y < 0 || y >= canvas.height) continue;
                if (pixels[pos] === sR && pixels[pos+1] === sG && pixels[pos+2] === sB && pixels[pos+3] === sA) {
                    pixels[pos] = fillRGB.r; pixels[pos+1] = fillRGB.g; pixels[pos+2] = fillRGB.b; pixels[pos+3] = 255;
                    stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
    </script>
</body>
</html>
