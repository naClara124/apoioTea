<style>
    /*estilo do site*/
body{
    font-family: 'Arial', sans-serif;
    background: linear-gradient(130deg,#67a8e6, #05539c);
    display: flex;
    padding: 0%;
    margin: 0%;
    color:#333;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/*quadrado branco*/
.container{
    background: #7BBFE6;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    text-align: center;
    max-width: 500px;
    height: 450px;
    
    
}

/*estilizaçãp do título*/
h1{
    font-size: 40px;
    align-items: center;
    justify-content: center;
}

/*estilização do subtítulo*/
h2{
    font-size: 20px;
    align-items: center;
    justify-content: center;
}

/*estilização do parágrafo*/
p{
    font-size: 15px;
    align-items: center;
    justify-content: center;
}

/*estilização da lista*/
ul{ 
    text-align: left;
    background:#7BBFE6;
    padding: 5px 40px;
    border-radius: 40px;
    margin: 20px 0;
    box-shadow: 5px 5px 15px #05539c;
}


/*estilização do botão*/
button{
    background-color: #d8db0e;
    color: black;
    border: none;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 5px 0 #b5b70e;
    margin-top: 10px;
}

/*animação do botão*/
button:hover{
    background-color: #ced10e;
    transform: translateY(-3px);
    box-shadow: 0 7px 0 #b5b70e;
}

/*animação ao manter o botão pressionado*/
button:active{
    transform: translateY(4px);
    box-shadow: none;
}


</style>
