<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escolha o seu nivel</title>
     <link rel="stylesheet" href="escolha seu nivel.css">
</head>
<body>
    <div class="cabecalho">
        <h1>Escolha o nível que deseja pintar</h1>
        <p>Esta é a caixa de texto centralizada na parte superior.</p>
    </div>

    <div class="container-botoes">
        <a href="desenhos_seletor.html"
            <button class="botao-imagem">
                <img src="https://picsum.photos/200/200?random=1" alt="Imagem 1">
                <span class="texto-botao">nível 1</span>
            </button>
        </a>


        <a href="desenhos_seletor_02.html">
            <button class="botao-imagem">
                <img src="https://picsum.photos/200/200?random=2" alt="Imagem 2">
                <span class="texto-botao">nível 2</span>
            </button>
        </a>
    </div>
</body>
</html>
<style>
        /* Estilos Gerais */
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(130deg, #94b2e0, #336abd);
        }

        /* Caixa de texto superior */
        .cabecalho {
            margin-top: 100px;
            padding: 20px;
            background-color: rgba(145, 181, 204, 0.856);
            border: 1px solid #000000;
            border-radius: 10px;
            width: 50%;
            text-align: center;
            box-shadow: 15px 15px 5px rgba(7, 43, 99, 0.1);
        }

        /* Container dos botões */
        .container-botoes {
            display: flex;
            gap: 85px; /* Espaçamento entre os botões */
            margin-top: auto;
            margin-bottom: auto; /* Centraliza verticalmente no espaço restante */
        }

        /* Estilo dos Botões */
        .botao-imagem {
            position: relative;
            width: 350px;
            height: 190px;
            border-radius: 20px; /* Bordas arredondadas */
            overflow: hidden; /* Garante que a imagem não ultrapasse os limites do botão */
            border: none; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 15px 15px 5px rgba(7, 43, 99, 0.1);
        }

        /* A imagem de fundo do botão */
        .botao-imagem img {
            display: block;
            width: 100%;
            height: 100%;
            filter: blur(4px); /* O desfoque na imagem */
            transition: filter 0.3s; /* Transição suave para o efeito de hover */
            object-fit: cover; /* Garante que a imagem cubra todo o botão */
        }

        /* O texto sobreposto */
        .texto-botao {
            position: absolute;
            color: rgb(255, 255, 255);
            font-weight: bold;
            font-size: 1.2rem; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7); 
            z-index: 1; /* Garante que o texto fique acima da imagem */
        }

        /* Efeito ao passar o mouse */
        .botao-imagem:hover img {
            filter: blur(0px); /* Remove o desfoque ao passar o mouse */
        }
       </style>
